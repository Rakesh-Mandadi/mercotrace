server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/mercotrace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Rakesh@2002}
# Starter convenience: tables are created/updated automatically. Switch to Flyway + "validate" for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-of-at-least-32-characters}
jwt.access-minutes=30
jwt.refresh-days=7

app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-seconds=30

app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}

# Seeded login (created on first start only)
app.seed.username=${SEED_USERNAME:admin}
app.seed.email=${SEED_EMAIL:admin@mercotrace.com}
app.seed.mobile=${SEED_MOBILE:9999999999}
app.seed.password=${SEED_PASSWORD:Admin@123}
