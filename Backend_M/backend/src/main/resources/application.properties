
# Server Configuration
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mercotrace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-minutes=30
jwt.refresh-days=7

# OTP Configuration
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.resend-seconds=30

# CORS Configuration
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:19006}

# Seeded Admin Configuration
app.seed.username=${SEED_USERNAME:admin}
app.seed.email=${SEED_EMAIL:admin@mercotrace.com}
app.seed.mobile=${SEED_MOBILE:9999999999}
app.seed.password=${SEED_PASSWORD:admin@123}
